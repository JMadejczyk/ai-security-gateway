# AI Control Layer demo stack. Topology (SPEC: "No bypassing the gateway"):
#
#   edge          internal  agent <-> gateway agent listener (:8080). Nothing else lives here.
#   ops           external  gateway operator listener (:9090, static IP), prometheus, loki,
#                           alloy, grafana (observability lives here and nowhere else)
#   llm_backend   internal  gateway <-> ollama
#   mcp_backend   internal  gateway <-> mcp-postgres, mcp-files, postgres
#   mcp_untrusted internal  gateway <-> mcp-fetch
#   state         internal  gateway <-> redis (budgets, sessions, loop counters, approvals)
#   fetch_egress  external  mcp-fetch only: its outbound internet access
#   bootstrap     external  ollama-init and models-init only (profile `init`), to fetch models
#                           before lock-down
#
# Only the gateway and Grafana publish ports, and only on 127.0.0.1. No container gets the
# Docker socket, `privileged`, or host networking/namespaces. Verified by tests/bypass/.
#
# Observability (SPEC "Audit, metrics and Grafana"): Prometheus scrapes the operator listener;
# the gateway writes audit JSONL to the `audit_log` volume, Grafana Alloy tails it read-only
# into Loki (no Docker socket); Grafana is provisioned from grafana/ and published on
# 127.0.0.1:${ACL_GRAFANA_HOST_PORT:-3300}.
#
# First run:
#   cp .env.example .env                                # then replace every secret
#   docker compose --profile init run --rm ollama-init  # one-off model pull (several GB)
#   docker compose --profile init run --rm models-init  # injection classifier (~750 MB, pinned)
#   docker compose up -d --build

name: ai-control-layer

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

networks:
  edge:
    internal: true
  ops:
    ipam:
      config:
        - subnet: 172.29.90.0/24
  llm_backend:
    internal: true
  mcp_backend:
    internal: true
  mcp_untrusted:
    # Internal on purpose: if it carried the internet route, Docker would pick it as the
    # gateway's default-route network and DNAT published ports to it instead of `ops`.
    # mcp-fetch reaches the internet through `fetch_egress`, a network nothing else joins.
    internal: true
  state:
    internal: true
  fetch_egress: {}
  bootstrap: {}

volumes:
  ollama_models: {}
  pgdata: {}
  reports: {}
  redis_data: {}
  injection_model: {}  # filled by models-init, mounted read-only by the gateway
  audit_log: {}        # gateway audit JSONL (rw for the gateway, ro for alloy): operator-only
  prometheus_data: {}
  loki_data: {}
  alloy_data: {}       # alloy's tail positions, so a restart neither skips nor re-sends lines
  grafana_data: {}

services:
  gateway:
    <<: *hardening
    build: .
    image: ai-control-layer/gateway:dev
    environment:
      ACL_POLICY_PATH: /app/policy.yaml
      ACL_IDENTITIES_PATH: /app/demo/identities.yaml
      # The agent listener serves `edge`; the demo agent reaches it there as http://gateway:8080.
      ACL_AGENT_HOST: 0.0.0.0
      ACL_AGENT_PORT: "8080"
      # The operator listener binds the gateway's `ops` address only, so `edge` and the upstream
      # networks cannot reach /auth/demo-token, /admin/* or /metrics.
      ACL_OPERATOR_HOST: 172.29.90.10
      ACL_OPERATOR_PORT: "9090"
      ACL_JWT_SECRET: ${ACL_JWT_SECRET:?set ACL_JWT_SECRET in .env}
      ACL_INTERNAL_KEY: ${ACL_INTERNAL_KEY:?set ACL_INTERNAL_KEY in .env}
      # Budget counters (SPEC "Budgets"). Redis unreachable = budget-limited calls fail closed.
      ACL_BUDGET_STORE: redis
      ACL_REDIS_URL: redis://redis:6379/0
      ACL_REDIS_PASSWORD: ${ACL_REDIS_PASSWORD:?set ACL_REDIS_PASSWORD in .env}
      # Session state (risk, taint, timers), loop counters, approvals and the kill switch live
      # in the same Redis, so a gateway restart keeps a tainted session tainted. Fail closed.
      ACL_SESSION_STORE: redis
      # Approved MCP tool baselines (tool_pinning), written on the host by
      # `python -m gateway.cli pin <server> --write`; a changed file applies on the next call.
      ACL_PINS_DIR: /app/pins
      # The pinned injection classifier (gateway/injection/model_manifest.json). Every file is
      # hashed at startup; missing or altered files and the gateway refuses to start.
      ACL_MODELS_DIR: /app/models
      # Audit JSONL export (rotated by size), tailed read-only by alloy into Loki.
      ACL_AUDIT_PATH: /var/log/acl/audit.jsonl
    volumes:
      - type: volume
        source: audit_log
        target: /var/log/acl
      - type: volume
        source: injection_model
        target: /app/models
        read_only: true
      - type: bind
        source: ./policy.yaml
        target: /app/policy.yaml
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./demo/identities.yaml
        target: /app/demo/identities.yaml
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./feeds
        target: /app/feeds
        read_only: true
      - type: bind
        source: ./pins
        target: /app/pins
        read_only: true
        bind: { create_host_path: false }
    networks:
      edge: {}
      ops:
        ipv4_address: 172.29.90.10
      llm_backend: {}
      mcp_backend: {}
      mcp_untrusted: {}
      state: {}
    ports:
      # Host ports are overridable when 9090/8080 are taken on the developer machine.
      - "127.0.0.1:${ACL_OPERATOR_HOST_PORT:-9090}:9090"  # operator API
      # Lets a developer on the host act as an agent; the demo agent uses `edge` instead.
      - "127.0.0.1:${ACL_AGENT_HOST_PORT:-8080}:8080"
    depends_on:
      ollama: { condition: service_started }
      mcp-postgres: { condition: service_started }
      mcp-files: { condition: service_started }
      mcp-fetch: { condition: service_started }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # Budget counters. redis 7.2 is the last BSD-3 line (7.4+ is RSALv2/SSPL). The password
  # reaches redis-server through a 0600 config file on tmpfs, never its command line. AOF on a
  # volume keeps the day's counters across a Redis restart.
  redis:
    <<: *hardening
    image: redis:7.2.16
    user: redis
    read_only: true
    tmpfs: [/tmp]
    environment:
      ACL_REDIS_PASSWORD: ${ACL_REDIS_PASSWORD:?set ACL_REDIS_PASSWORD in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        umask 077;
        printf 'requirepass %s\n' "$$ACL_REDIS_PASSWORD" > /tmp/redis.conf;
        exec redis-server /tmp/redis.conf --dir /data --appendonly yes --save ''
    volumes:
      - redis_data:/data
    networks: [state]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$ACL_REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.35.1
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_models:/root/.ollama
    networks: [llm_backend]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-off model pull on a temporary network with internet access; `ollama` itself never gets
  # one. Run before `up`: docker compose --profile init run --rm ollama-init
  ollama-init:
    profiles: [init]
    image: ollama/ollama:0.35.1
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
    volumes:
      - ollama_models:/root/.ollama
    networks: [bootstrap]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama serve & server=$$!;
        until ollama list >/dev/null 2>&1; do sleep 1; done;
        ollama pull "$$OLLAMA_MODEL"; status=$$?;
        kill $$server; exit $$status

  # One-off fetch of the injection classifier: exactly the files and revision the manifest pins,
  # each SHA-256 verified before it is moved into the volume. Same image as the gateway, on the
  # temporary `bootstrap` network only. Run before `up`:
  #   docker compose --profile init run --rm models-init
  models-init:
    <<: *hardening
    profiles: [init, models-init]
    build: .
    image: ai-control-layer/gateway:dev
    read_only: true
    tmpfs: [/tmp]
    command: ["python", "-m", "gateway.injection.fetch", "--dest", "/app/models"]
    volumes:
      - injection_model:/app/models
    networks: [bootstrap]
    healthcheck:
      disable: true

  mcp-postgres:
    <<: *hardening
    build: ./demo/mcp_servers
    image: ai-control-layer/demo-mcp:dev
    command: ["postgres"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      PGHOST: postgres
      PGDATABASE: acl_demo
      PGUSER: acl_app
      ACL_APP_DB_PASSWORD: ${ACL_APP_DB_PASSWORD:?set ACL_APP_DB_PASSWORD in .env}
      ACL_INTERNAL_KEY: ${ACL_INTERNAL_KEY:?set ACL_INTERNAL_KEY in .env}
    networks: [mcp_backend]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  mcp-files:
    <<: *hardening
    build: ./demo/mcp_servers
    image: ai-control-layer/demo-mcp:dev
    command: ["files"]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - reports:/data/reports
    networks: [mcp_backend]
    restart: unless-stopped

  mcp-fetch:
    <<: *hardening
    build: ./demo/mcp_servers
    image: ai-control-layer/demo-mcp:dev
    command: ["fetch"]
    read_only: true
    tmpfs: [/tmp]
    networks: [mcp_untrusted, fetch_egress]
    restart: unless-stopped

  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_DB: acl_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ACL_APP_DB_PASSWORD: ${ACL_APP_DB_PASSWORD:?set ACL_APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - type: bind
        source: ./demo/db
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind: { create_host_path: false }
    networks: [mcp_backend]
    healthcheck:
      test: ["CMD", "pg_isready", "--username=postgres", "--dbname=acl_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  agent:
    <<: *hardening
    build: ./demo/agent
    image: ai-control-layer/demo-agent:dev
    read_only: true
    tmpfs: [/tmp]
    environment:
      ACL_GATEWAY_URL: http://gateway:8080
    networks: [edge]
    restart: unless-stopped

  # ------------------------------------------------------------------ observability (`ops`)
  # Prometheus, Loki, Alloy and Grafana join `ops` only and run as their images' non-root
  # users with a read-only root filesystem. Only Grafana publishes a port, on 127.0.0.1.

  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.15.0
    read_only: true
    tmpfs: [/tmp]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - type: bind
        source: ./observability/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind: { create_host_path: false }
      - prometheus_data:/prometheus
    networks: [ops]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  loki:
    <<: *hardening
    image: grafana/loki:3.7.8
    read_only: true
    tmpfs: [/tmp]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - type: bind
        source: ./observability/loki/loki.yaml
        target: /etc/loki/loki.yaml
        read_only: true
        bind: { create_host_path: false }
      - loki_data:/loki
    networks: [ops]
    restart: unless-stopped

  # Tails the audit JSONL the gateway writes; the volume is mounted read-only. No Docker socket.
  alloy:
    <<: *hardening
    image: grafana/alloy:v1.20.1
    user: "473:473"  # the image's `alloy` user (the image default is root)
    read_only: true
    tmpfs: [/tmp]
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345  # debug UI stays inside the container
      - --disable-reporting
    volumes:
      - type: bind
        source: ./observability/alloy/config.alloy
        target: /etc/alloy/config.alloy
        read_only: true
        bind: { create_host_path: false }
      - type: volume
        source: audit_log
        target: /var/log/acl
        read_only: true
      - alloy_data:/var/lib/alloy/data
    networks: [ops]
    depends_on:
      loki: { condition: service_started }
    restart: unless-stopped

  # Data sources and the four dashboards come from grafana/ (read-only). The admin password
  # applies when grafana_data is first initialised; change it later in Grafana or `down -v`.
  grafana:
    <<: *hardening
    image: grafana/grafana:12.4.12
    read_only: true
    tmpfs: [/tmp]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${ACL_GRAFANA_ADMIN_PASSWORD:?set ACL_GRAFANA_ADMIN_PASSWORD in .env}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"  # the verification scripts use the admin account
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/posture.json
      GF_LOG_MODE: console
    volumes:
      - type: bind
        source: ./grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./grafana/dashboards
        target: /etc/grafana/dashboards
        read_only: true
        bind: { create_host_path: false }
      - grafana_data:/var/lib/grafana
    networks: [ops]
    ports:
      - "127.0.0.1:${ACL_GRAFANA_HOST_PORT:-3300}:3000"
    depends_on:
      prometheus: { condition: service_started }
      loki: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
