  # ------------------------------------------------------------------------------- ssrf
  - id: ssrf-metadata-ip
    category: ssrf
    title: The cloud metadata endpoint
    channel: mcp_call
    server: web
    tool: fetch
    payload: {url: "http://169.254.169.254/latest/meta-data/iam/security-credentials/"}
    expect:
      decision: block
      reason: egress_private_address
      verdicts: [{control: egress, decision: block, reason_code: egress_private_address}]
      upstream_called: false
    proves: [egress:deny]
    see: [tests/mcp/test_egress_mcp.py, tests/bypass/test_network_isolation.py]

  - id: ssrf-dns-to-loopback
    category: ssrf
    title: A public-looking name that resolves to loopback
    channel: mcp_call
    server: web
    tool: fetch
    payload: {url: "http://localtest.attacker.example:80/admin"}
    setup: {dns: {localtest.attacker.example: [127.0.0.1]}}
    expect: {decision: block, reason: egress_private_address, upstream_called: false}
    proves: [egress:deny]

  - id: ssrf-decimal-ip
    category: ssrf
    title: The metadata address written as one decimal number (libc resolves it)
    channel: mcp_call
    server: web
    tool: fetch
    payload: {url: "http://2852039166/latest/meta-data/"}
    setup: {dns: {"2852039166": [169.254.169.254]}}
    expect: {decision: block, reason: egress_private_address, upstream_called: false}
    proves: [egress:deny]

  - id: ssrf-ipv4-mapped-ipv6
    category: ssrf
    title: The metadata address wrapped in an IPv4-mapped IPv6 literal
    channel: mcp_call
    server: web
    tool: fetch
    payload: {url: "http://[::ffff:169.254.169.254]/"}
    expect: {decision: block, reason: egress_private_address, upstream_called: false}
    proves: [egress:deny]

  - id: ssrf-internal-port
    category: ssrf
    title: A public host on the SSH port
    channel: mcp_call
    server: web
    tool: fetch
    payload: {url: "http://example.com:22/"}
    expect: {decision: block, reason: egress_port_not_allowed, upstream_called: false}
    proves: [egress:deny]

  - id: ssrf-userinfo-confusion
    category: ssrf
    title: Userinfo that makes a parser read the wrong host
    channel: mcp_call
    server: web
    tool: fetch
    payload: {url: "http://example.com@169.254.169.254/"}
    expect: {decision: block, reason: invalid_arguments, upstream_called: false}
    proves: [authz:deny]
    see: [tests/mcp/test_adapters.py]

  - id: benign-public-fetch
    category: benign
    title: A public page is fetched
    channel: mcp_call
    server: web
    tool: fetch
    payload: {url: "https://example.com/prices"}
    setup:
      fetch_page: "<html><body>Cables from 4.20 PLN/m.</body></html>"
    expect:
      decision: allow
      verdicts:
        - {control: egress, decision: allow}
        - {control: prompt_injection, decision: allow}
        - {control: signatures, decision: allow}
      upstream_called: true
    proves: [egress:allow, prompt_injection:allow, signatures:allow]
    real_model: allow

  # ------------------------------------------------------------------- resource abuse
  - id: abuse-loop
    category: resource_abuse
    title: The same fetch six times within a minute
    channel: mcp_call
    server: web
    tool: fetch
    payload: {url: "https://example.com/again"}
    setup:
      fetch_page: "<p>same page</p>"
      repeat: 6
    expect:
      decision: block
      reason: loop_detected
      verdicts: [{control: loop_detect, decision: block}]
    proves: [loop_detect:deny]
    see: [tests/unit/test_loop_detect.py]

  - id: abuse-tool-call-budget
    category: resource_abuse
    title: Distinct reports until the session's tool-call budget runs out
    channel: mcp_call
    server: reports
    tool: write_report
    payload: {name: r.md, content: x}
    setup:
      policy: {budgets: {per_session: {tool_calls: 3}}}
      repeat: 4
      vary: name
    expect:
      decision: block
      verdicts: [{control: budget, decision: block}]
    proves: [budget:deny]
    see: [tests/budget/test_budget_pipeline.py]

