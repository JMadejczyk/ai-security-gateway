[project]
name = "ai-control-layer"
version = "0.1.0"
description = "Security gateway for agent traffic to LLMs and MCP tools: delegated identity, policy, session risk."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
    "watchfiles>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]  # prose, not code: never reformat SPEC.md

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PT",
    "ANN", "ASYNC", "S", "PL", "TRY", "PERF",
]

[tool.ruff.lint.per-file-ignores]
# Test signatures are dictated by fixtures + parametrize; messages in tests are fixtures too.
"tests/**" = ["S101", "PLR2004", "ANN", "PLR0913", "PLR0917", "TRY003"]

[tool.ruff.lint.isort]
known-first-party = ["gateway"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["gateway", "tests"]
typeCheckingMode = "basic"
strict = ["gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers"]
markers = [
    "docker: needs the live docker compose stack (run with `make test-docker`)",
]
