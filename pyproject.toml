[project]
name = "ai-control-layer"
version = "0.1.0"
description = "Security gateway for agent traffic to LLMs and MCP tools: delegated identity, policy, session risk."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "onnxruntime>=1.30.0",
    "presidio-analyzer>=2.2.364",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "regex>=2026.9.29",
    "sqlglot>=30.21.0",
    "tldextract>=5.3.2",
    "tokenizers>=0.23.2",
    "uvicorn[standard]>=0.54.0",
    "watchfiles>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.39.0",
    "mcp==2.3.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]  # prose, not code: never reformat SPEC.md

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PT",
    "ANN", "ASYNC", "S", "PL", "TRY", "PERF",
]

[tool.ruff.lint.per-file-ignores]
# Test signatures are dictated by fixtures + parametrize; messages in tests are fixtures too.
"tests/**" = ["S101", "PLR2004", "ANN", "PLR0913", "PLR0917", "TRY003"]

[tool.ruff.lint.isort]
known-first-party = ["gateway"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["gateway", "tests"]
typeCheckingMode = "basic"
strict = ["gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers"]
markers = [
    "docker: needs the live docker compose stack (run with `make test-docker`)",
    "redis: needs a real Redis (a throwaway docker container, or ACL_TEST_REDIS_URL); skips without",
    "model: needs the pinned injection model in models/cache (python -m gateway.injection.fetch); skips without",
]
