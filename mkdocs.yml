site_name: AI Security Gateway
site_description: A self-hosted, hybrid (rules + AI) control layer for every LLM and MCP call your agents make.
site_url: https://jmadejczyk.github.io/ai-security-gateway/
repo_url: https://github.com/JMadejczyk/ai-security-gateway
repo_name: JMadejczyk/ai-security-gateway
edit_uri: edit/main/docs/
copyright: Apache-2.0 · AI Security Gateway

docs_dir: docs
exclude_docs: |
  video.md
  overrides/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/shield.png
  favicon: assets/shield.png
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

hooks:
  - docs/overrides/hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.snippets: { base_path: ["."], check_paths: true }
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Get started:
      - Run it: getting-started.md
      - Concepts: concepts.md
      - Demo walkthrough: demo.md
      - Use it with opencode: opencode.md
  - Reference:
      - Architecture: architecture.md
      - The 15 controls: controls.md
      - Policy file: policy.md
      - OpenRouter mode (DeepSeek): remote.md
      - Operations: operations.md
      - Specification: spec.md
  - Reporting & proof:
      - Security reporting: reporting.md
      - Test suite: testing.md
      - Control coverage: reports/controls.md
      - Performance: reports/perf.md
