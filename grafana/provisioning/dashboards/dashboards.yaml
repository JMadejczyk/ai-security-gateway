# The four dashboards (Posture, Threats, Session trace, Performance), generated by
# grafana/build_dashboards.py into grafana/dashboards/ and mounted read-only.
apiVersion: 1

providers:
  - name: ai-control-layer
    orgId: 1
    folder: AI Control Layer
    folderUid: acl
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
